<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Printer Dashboard</title>
        <link rel="stylesheet" href="/assets/styles.css" type="text/css">
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <meta name="apple-mobile-web-app-title" content="Printer Control" />
        <meta http-equiv="refresh" content="30">
        <link rel="manifest" href="/manifest.json" />
    </head>
    <header>
        <div class="action-bar">
            <a href="/"><img src="/favicon.ico" alt="Logo" class="logo"></a>
        </div>
    </header>
    <body>
        <div class="sub-sub-header p-4">Add GCode File:</div>
        <div class="upload_button">
            <form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
                <input id="fileInput" type="file" name="file" required class="center">
                <input type="submit" value="Upload" class="upbutton">
            </form>
        </div>
        <div class="sub-sub-header p-4">Select Saved GCode File:</div>
        {lists}
    </body>
</html>

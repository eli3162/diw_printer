<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Printer Dashboard</title>
        <script src="./script/tailwind.js"></script>
        <link rel="stylesheet" href="./assets/styles.css">
        <link rel="icon" type="image/png" href="./assets/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
        <link rel="shortcut icon" href="./favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Printer Control" />
        <link rel="manifest" href="./manifest.json">
        <script src="./mini-coi-fd.js"></script>
        <script type="module" src="./pyscript/core.js" offline></script>
        <link rel="stylesheet" href="./pyscript/core.css">
        <script src="./script/webserial.js"></script>
</head>
    <header>
        <div class="action-bar">
            <a href=""><img src="./favicon.ico" alt="Logo" class="logo"></a>
        </div>
    </header>
    <body>
        <div class="sub-sub-header p-4">Connect Printer</div>
        <button id="connect" class="upload_button hover:bold rounded-lg transition-transform duration-300 ease-in-out hover:scale-105">Connect Printer - Not Connected</button>
        <br><br>
        <div class="selectinput_box">
            <input id="message" value="print('Hello World!')">
            <button id="send">Send</button>
        </div>
        <br>
        <div class="terminal_box">
            <h3 class="">Terminal</h3>
            <pre id="output"></pre>
        </div>
        <script type="mpy" src="./gui.py"></script>
    </body>
</html>
